# DEPRECATED: use FastSwapConfig.testnet.yaml (4-chain prod mirror) or
# FastSwapConfig.testnet.local.yaml.example for local deployed-address overlay.
# Kept for legacy Sepolia+Nile e2e-nodes runs only.
version: 1
active-chains:
  - sepolia
  - tron
server:
  host: 127.0.0.1
  apiPort: 4010
  publicUrl: http://127.0.0.1:4010
  sqlitePath: ./data/fastswap-testnet.sqlite
  auditLogPath: ./data/api-audit-testnet.jsonl
  signingSecretEnv: API_SIGNING_SECRET
  captcha:
    provider: cloudflare-turnstile
    siteKey: ""
    secretKey: ""
    requireForQuotes: false
    requireForInvoices: false
quote:
  feeBps: 30
  maxDeviationBps: 500
  quoteTtlSec: 900
  packsUsdMicros:
    - "100000"
    - "250000"
    - "1000000"
sweepNode:
  pollIntervalMs: 15000
  pageLimit: 500
  confirmations: 1
  logScanOverlap: 50
  sqlitePath: ./data/sweep-testnet.sqlite
relayNode:
  pollIntervalMs: 5000
  confirmations: 1
liquidityMonitor:
  pollIntervalMs: 15000
deploy:
  createx: "0xba5Ed099633D3B313e4D5F7bdc1305d3c28ba5Ed"
  owner: "0xc2eCF8b48b9D5D1Fd04b8A9c15126011aa1cC3Eb"
  salts:
    namespace: fastswap-testnet
    version: "1"
  contracts:
    fastSwapImplementation: "0x2fE48F28F5Bf48FD79d334607A1380E3b07cCD19"
    fastSwapAddress: "0xA24987b5121742D2dF98Ad3ED41c6A1Fef54C7Cf"
    sweeperAddress: "0x62dA9f8fFaD1E628FC3C53DCA8A07f6bBe874bA6"
    forwarderImplementation: "0x008F11FE82D54d8fada0BBf302C6423dFc55b7BB"
    liquidityManagerImplementation: "0x98b230f33B7f336e33CC0C43031b8D48f7eb8012"
    liquidityManagerAddress: "0x05eE01894AEB23916110C4F05fa7deBd0d3b88C9"
  resolvedSalts:
    fastSwapImplementation: "0x1db81fa583afa658bb01ffbfbb9866b5c1cde5d1f517771ce3bc3004737db5cf"
    fastSwapProxy: "0xe17ab927db326786ce9104931408324dc43a0a270bb87b6237250d66492c9df7"
    invoiceSweeper: "0x622f12196f838dd1ff0a16121e7325eb0992203025ab009af984b2d809c5c9ac"
    liquidityManagerImplementation: "0xa53c1a8edcb31a2f5857e7c9d5976bc7f398173266dc28e49b0c17d4e3f63164"
    liquidityManagerProxy: "0xf42b2e4497a6bb84558d608990833881a208fe2e707d707736cd937761ade64e"
liquidityManager:
  pollIntervalMs: 60000
  sqlitePath: ./data/liquidity-manager-testnet.sqlite
  economics:
    gasGateBps: 10
    minNotionalUsd: 0.05
    maxStalenessSec: 300
    riskCapUsd: 50
    cooldownSec: 60
    slippageBps: 100
    maxGasPriceGwei: 200
nodes:
  sweep:
    auditLogPath: ./data/sweep-audit-testnet.jsonl
  relay:
    progressPath: ./data/relay-progress-testnet.json
    auditLogPath: ./data/relay-audit-testnet.jsonl
  liqman:
    auditLogPath: ./data/liqman-audit-testnet.jsonl
chains:
  - key: sepolia
    id: "11155111"
    type: evm
    name: Sepolia
    optional: false
    rpcUrl: "${SEPOLIA_RPC_URL}"
    explorerUrl: https://sepolia.etherscan.io
    confirmations: 1
    startBlock: 11235000
    aggregatorSlug: eth
    nativeSentinel: "0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE"
    router: "0x6352a56caadC4F1E25CD6c75970Fa768A3304e64"
