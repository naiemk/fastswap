version: 1
active-chains:
  - base
  - arbitrum
  - bsc
  - tron
server:
  host: 0.0.0.0
  apiPort: 4010
  publicUrl: https://api.example.com
  sqlitePath: ./data/fastswap.sqlite
  auditLogPath: ./data/api-audit.jsonl
  signingSecretEnv: API_SIGNING_SECRET
  captcha:
    provider: cloudflare-turnstile
    siteKey: ""
    secretKey: ""
    requireForQuotes: false
    requireForInvoices: false
quote:
  feeBps: 75
  maxDeviationBps: 100
  quoteTtlSec: 900
  packsUsd:
    - "10"
    - "20"
    - "25"
    - "40"
    - "50"
    - "100"
    - "200"
sweepNode:
  pollIntervalMs: 30000
  pageLimit: 500
  confirmations: 3
  logScanOverlap: 100
  sqlitePath: ./data/sweep-node.sqlite
executeNode:
  pollIntervalMs: 5000
deploy:
  createx: "0xba5Ed099633D3B313e4D5F7bdc1305d3c28ba5Ed"
  owner: ${FASTSWAP_OWNER_ADDRESS}
  salts:
    namespace: fastswap
    version: "1"
  contracts:
    fastSwapImplementation: ""
    fastSwapAddress: ""
    sweeperAddress: ""
    forwarderImplementation: ""
nodes:
  sweep:
    auditLogPath: ./data/sweep-audit.jsonl
  execute:
    progressPath: ./data/execute-progress.json
    auditLogPath: ./data/execute-audit.jsonl
    pollIntervalMs: 5000
chains:
  - key: base
    id: "8453"
    type: evm
    name: Base
    optional: false
    rpcUrl: ${BASE_RPC_URL}
    explorerUrl: https://basescan.org
    confirmations: 3
    startBlock: 0
    aggregatorSlug: base
    nativeSentinel: "0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE"
    router: ${BASE_ROUTER_ADDRESS}
    tokens:
      ETH:
        decimals: 18
        isNative: true
        priceSources:
          - type: coingecko
            coinId: ethereum
          - type: binance
            symbol: ETHUSDT
      USDC:
        address: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
        decimals: 6
        priceUsd: "1"
        priceSources:
          - type: coingecko
            coinId: usd-coin
  - key: arbitrum
    id: "42161"
    type: evm
    name: Arbitrum One
    optional: false
    rpcUrl: ${ARBITRUM_RPC_URL}
