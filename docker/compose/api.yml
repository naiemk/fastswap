# FastSwap API — expose only this service to the internet (e.g. behind Caddy/nginx).
# Build context is the parent of onchain-invoice/ and fastswap/ (e.g. /workspaces).
services:
  api:
    build:
      context: ../../..
      dockerfile: fastswap/docker/Dockerfile
    command: ["node", "dist/server/main.js", "/config/FastSwapConfig.yaml"]
    env_file:
      - .env
    environment:
      API_SIGNING_SECRET: ${API_SIGNING_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - ../../FastSwapConfig.yaml:/config/FastSwapConfig.yaml:ro
      - api-data:/app/data
    ports:
      - "${API_PORT:-4010}:4010"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - fastswap
    restart: unless-stopped

volumes:
  api-data:

networks:
  fastswap:
    name: fastswap
