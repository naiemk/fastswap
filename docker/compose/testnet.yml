# FastSwap 2-chain testnet stack — Sepolia + TRON Nile (api + sweep + relay + liqman).
# Setup:
#   cp ../../.env.testnet.example .env   # fill secrets, Turnstile, routers
#   npm run docker:testnet:build && npm run docker:testnet:up
x-fastswap-testnet-build: &fastswap-testnet-build
  build:
    context: ../../..
    dockerfile: fastswap/docker/Dockerfile

x-fastswap-testnet-config-volume: &fastswap-testnet-config-volume
  ../../FastSwapConfig.testnet.yaml:/config/FastSwapConfig.yaml:ro

x-fastswap-testnet-chain-env: &fastswap-testnet-chain-env
  SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL}
  NILE_FULL_HOST: ${NILE_FULL_HOST}
  SEPOLIA_ROUTER_ADDRESS: ${SEPOLIA_ROUTER_ADDRESS}
  TRON_ROUTER_ADDRESS: ${TRON_ROUTER_ADDRESS}
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
  FASTSWAP_PUBLIC_URL: ${FASTSWAP_PUBLIC_URL}
  FASTSWAP_OWNER_ADDRESS: ${FASTSWAP_OWNER_ADDRESS:-}

services:
  api:
    <<: *fastswap-testnet-build
    command: ["node", "dist/server/main.js", "/config/FastSwapConfig.yaml"]
    env_file:
      - .env
    environment:
      API_SIGNING_SECRET: ${API_SIGNING_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      <<: *fastswap-testnet-chain-env
    volumes:
      - *fastswap-testnet-config-volume
      - api-testnet-data:/app/data
    ports:
      - "${API_PORT:-4010}:4010"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - fastswap-testnet
    restart: unless-stopped

  sweep:
    <<: *fastswap-testnet-build
    command: ["node", "dist/nodes/sweep-main.js", "/config/FastSwapConfig.yaml"]
    env_file:
      - .env
    environment:
      FASTSWAP_API_BASE: http://api:4010
      API_SIGNING_SECRET: ${API_SIGNING_SECRET}
      SWEEP_EVM_PRIVATE_KEY: ${SWEEP_EVM_PRIVATE_KEY}
      SWEEP_TRON_PRIVATE_KEY: ${SWEEP_TRON_PRIVATE_KEY}
      TRON_INVOICE_MASTER_SECRET: ${TRON_INVOICE_MASTER_SECRET:-}
      <<: *fastswap-testnet-chain-env
    volumes:
      - *fastswap-testnet-config-volume
      - sweep-testnet-data:/app/data
    networks:
      - fastswap-testnet
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  relay:
    <<: *fastswap-testnet-build
    command: ["node", "dist/nodes/relay-node/main.js", "/config/FastSwapConfig.yaml"]
    env_file:
      - .env
    environment:
      FASTSWAP_API_BASE: http://api:4010
      API_SIGNING_SECRET: ${API_SIGNING_SECRET}
      RELAY_EVM_PRIVATE_KEY: ${RELAY_EVM_PRIVATE_KEY}
      RELAY_TRON_PRIVATE_KEY: ${RELAY_TRON_PRIVATE_KEY}
      <<: *fastswap-testnet-chain-env
    volumes:
      - *fastswap-testnet-config-volume
      - relay-testnet-data:/app/data
    networks:
      - fastswap-testnet
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  liqman:
    <<: *fastswap-testnet-build
    command: ["node", "lm-dist/LiquidityManager/bot/index.js", "--fastswap-config", "/config/FastSwapConfig.yaml"]
    env_file:
      - .env
    environment:
      LM_PRIVATE_KEY: ${LM_PRIVATE_KEY}
      <<: *fastswap-testnet-chain-env
    volumes:
      - *fastswap-testnet-config-volume
      - liqman-testnet-data:/app/data
    networks:
      - fastswap-testnet
    restart: unless-stopped

volumes:
  api-testnet-data:
  sweep-testnet-data:
  relay-testnet-data:
  liqman-testnet-data:

networks:
  fastswap-testnet:
    name: fastswap-testnet
